<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Nigeria NSW | Time Release Study</title>
</head>
<body>
<p style="font-family:system-ui;padding:2rem">Loading TRS dashboard…</p>
<script>
fetch('app.html').then(r=>r.text()).then(html=>{
  document.open();
  document.write(html);
  document.close();
}).catch(e=>{
  document.body.innerHTML='<p>Failed to load app.html: '+e+'</p>';
});
</script>
</body>
</html>
