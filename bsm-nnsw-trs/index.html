<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Nigeria NSW | TRS v0.8.1</title></head>
<body><p style="font-family:system-ui;padding:2rem;color:#334155">Loading TRS dashboard…</p>
<script>
(async function(){
  let b64 = '';
  for (let i = 0; i < 4; i++) {
    const t = await fetch('q' + i + '.txt').then(r => {
      if (!r.ok) throw new Error('Failed to load q' + i + '.txt: ' + r.status);
      return r.text();
    });
    b64 += t.replace(/\s+/g, '');
  }
  if (!/^[A-Za-z0-9+/=]+$/.test(b64)) throw new Error('Invalid base64 payload (length ' + b64.length + ')');
  const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream('deflate'));
  const html = await new Response(stream).text();
  document.open(); document.write(html); document.close();
})().catch(e => {
  document.body.innerHTML = '<pre style="padding:1rem;color:#b91c1c;white-space:pre-wrap">' + String(e) + '\n' + (e.stack || '') + '</pre>';
});
</script></body></html>
