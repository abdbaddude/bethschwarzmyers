<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Nigeria NSW | TRS v0.9.0</title></head>
<body><p style="font-family:system-ui;padding:2rem;color:#334155">Loading TRS…</p>
<script>
(async function(){
  let b64 = '';
  for (let i = 0; i < 8; i++) {
    const t = await fetch('spa' + i + '.txt').then(r => {
      if (!r.ok) throw new Error('spa' + i + '.txt ' + r.status);
      return r.text();
    });
    b64 += t.replace(/\s+/g, '');
  }
  const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const html = await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.open(); document.write(html); document.close();
})().catch(e => {
  document.body.innerHTML = '<pre style="padding:1rem;color:#b91c1c;white-space:pre-wrap">' + e + '\n' + (e.stack||'') + '</pre>';
});
</script></body></html>
