<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Nigeria NSW | TRS v0.9.0</title></head>
<body><p style="font-family:system-ui;padding:2rem;color:#334155">Loading TRS dashboard…</p>
<script>
(async function(){
  let html = '';
  for (let i = 0; i < 4; i++) {
    const t = await fetch('part' + i + '.txt').then(r => {
      if (!r.ok) throw new Error('Failed to load part' + i + '.txt: ' + r.status);
      return r.text();
    });
    html += t;
  }
  document.open(); document.write(html); document.close();
})().catch(e => {
  document.body.innerHTML = '<pre style="padding:1rem;color:#b91c1c;white-space:pre-wrap">' + String(e) + '\n' + (e.stack||'') + '</pre>';
});
</script></body></html>
