<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Nigeria NSW | TRS v0.5.0</title></head>
<body><p style="font-family:system-ui;padding:2rem;color:#334155">Loading full TRS dashboard (Executive · Observatory · Network)…</p>
<script>
(async function(){
  let b64='';
  for(let i=0;i<6;i++){ b64 += (await fetch('p'+i+'.txt').then(r=>r.text())).trim(); }
  const bin = Uint8Array.from(atob(b64), c=>c.charCodeAt(0));
  const stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream('deflate'));
  const html = await new Response(stream).text();
  document.open(); document.write(html); document.close();
})().catch(e=>{ document.body.innerHTML='<pre style="padding:1rem;color:#b91c1c">'+e+'\n'+e.stack+'</pre>'; });
</script></body></html>
