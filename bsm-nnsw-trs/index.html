<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nigeria NSW | Time Release Study</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    body { font-family: Inter, system-ui, sans-serif; }
    .card { background: white; border-radius: 0.75rem; box-shadow: 0 1px 2px rgba(0,0,0,.05); border: 1px solid #e2e8f0; }
    .tab-active { border-bottom: 2px solid #059669; color: #047857; font-weight: 600; }
    .anomaly-row { background: #fff1f2; border-left: 4px solid #fb7185; }
    .portrait-wrap { max-width: 820px; margin: 0 auto; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
<div class="portrait-wrap bg-slate-50 min-h-screen shadow-lg">
<header class="bg-white border-b border-slate-200 sticky top-0 z-50">
  <div class="px-4 py-3 flex flex-wrap items-center justify-between gap-2">
    <div class="flex items-center gap-2.5">
      <div class="w-10 h-10 rounded-full bg-emerald-700 flex items-center justify-center text-white font-bold text-sm shadow">NRS</div>
      <div>
        <h1 class="text-base font-bold text-slate-900 leading-tight" id="hdrTitle">Nigeria National Single Window (NSW)</h1>
        <p class="text-xs text-slate-500" id="hdrSub">Time Release Study (TRS) - Trade Clearance Performance</p>
      </div>
    </div>
    <div class="flex flex-wrap items-center gap-1.5 text-[10px]">
      <span class="inline-flex items-center gap-1 bg-slate-100 px-2 py-0.5 rounded-full" id="hdrQuarter">-</span>
      <span class="inline-flex items-center gap-1 bg-slate-100 px-2 py-0.5 rounded-full" id="hdrPort">-</span>
      <span class="inline-flex items-center gap-1 bg-slate-100 px-2 py-0.5 rounded-full" id="hdrSample">-</span>
      <span class="bg-sky-100 text-sky-800 px-2 py-0.5 rounded-full font-medium">Illustrative</span>
    </div>
  </div>
</header>
<div class="bg-white border-b border-slate-200 px-4 py-2 flex flex-wrap gap-2 items-center">
  <label class="text-xs text-slate-500">Port</label>
  <select id="portSelect" class="border border-slate-300 rounded-lg px-2 py-1 text-sm" onchange="onFilterChange()"></select>
  <label class="text-xs text-slate-500 ml-2">Quarter</label>
  <select id="quarterSelect" class="border border-slate-300 rounded-lg px-2 py-1 text-sm" onchange="onFilterChange()"></select>
</div>
<nav class="bg-white border-b border-slate-200">
  <div class="px-2 flex gap-0.5 overflow-x-auto text-xs">
    <button onclick="showTab('executive')" id="tab-executive" class="tab-btn px-3 py-2.5 whitespace-nowrap tab-active"><i class="fa-solid fa-chart-line mr-1"></i>Executive</button>
    <button onclick="showTab('shipments')" id="tab-shipments" class="tab-btn px-3 py-2.5 whitespace-nowrap text-slate-600"><i class="fa-solid fa-list mr-1"></i>Shipments</button>
    <button onclick="showTab('agencies')" id="tab-agencies" class="tab-btn px-3 py-2.5 whitespace-nowrap text-slate-600"><i class="fa-solid fa-building-columns mr-1"></i>Agencies</button>
    <button onclick="showTab('anomalies')" id="tab-anomalies" class="tab-btn px-3 py-2.5 whitespace-nowrap text-slate-600"><i class="fa-solid fa-triangle-exclamation mr-1"></i>Anomalies</button>
  </div>
</nav>
<main class="px-4 py-4 space-y-4" id="mainContent">
  <!-- Content rendered by JS -->
</main>
<footer class="px-4 py-6 text-center text-[10px] text-slate-400 border-t border-slate-200 mt-4">
  <span id="footerDisclaimer">NNSW TRS Intelligence Prototype · Illustrative data · Not official statistics</span>
</footer>
</div>
<script>
/* Full interactive TRS prototype - loads data/*.json */
let META, PORT_DATA={}, SHIPMENTS=[], currentPort='tincan', currentQuarter='2026-Q2';
let stageBarChart, delayDonut;
Chart.register(ChartDataLabels);

async function boot(){
  try{
    const [meta,tincan,lekki,onne,ships]=await Promise.all([
      fetch('data/meta.json').then(r=>r.json()),
      fetch('data/tincan.json').then(r=>r.json()),
      fetch('data/lekki.json').then(r=>r.json()),
      fetch('data/onne.json').then(r=>r.json()),
      fetch('data/shipments.json').then(r=>r.json())
    ]);
    META=meta;PORT_DATA={tincan,lekki,onne};SHIPMENTS=ships.shipments||ships;
    const portSel=document.getElementById('portSelect');
    const qSel=document.getElementById('quarterSelect');
    META.ports.forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.name;portSel.appendChild(o);});
    META.quarters.forEach(q=>{const o=document.createElement('option');o.value=q;o.textContent=q;qSel.appendChild(o);});
    portSel.value=currentPort;qSel.value=currentQuarter;
    document.getElementById('hdrTitle').textContent=META.title;
    document.getElementById('hdrSub').textContent=META.subtitle;
    document.getElementById('footerDisclaimer').textContent=META.disclaimer;
    buildShell();
    renderAll();
  }catch(err){
    document.getElementById('mainContent').innerHTML='<div class="card p-6 text-center text-rose-600"><p class="font-semibold">Failed to load data files</p><p class="text-xs mt-2">'+err.message+'</p><p class="text-xs mt-2 text-slate-500">Serve over HTTP (Netlify). file:// will not work with fetch.</p></div>';
  }
}
function buildShell(){
  document.getElementById('mainContent').innerHTML=`
  <section id="panel-executive" class="tab-panel space-y-4">
    <div class="grid grid-cols-2 gap-2.5">
      <div class="card p-3"><p class="text-[10px] text-slate-500 uppercase">Median Release</p><p class="text-xl font-bold mt-0.5" id="kpiTotal">-</p><p class="text-[10px] mt-0.5" id="kpiDelta">-</p></div>
      <div class="card p-3"><p class="text-[10px] text-slate-500 uppercase">Sample Size</p><p class="text-xl font-bold mt-0.5" id="kpiSample">-</p><p class="text-[10px] text-slate-500 mt-0.5">Import consignments</p></div>
      <div class="card p-3"><p class="text-[10px] text-slate-500 uppercase">Top Bottleneck</p><p class="text-xl font-bold text-rose-600 mt-0.5" id="kpiBottleneck">-</p><p class="text-[10px] text-slate-500 mt-0.5" id="kpiBottleneckDetail">-</p></div>
      <div class="card p-3"><p class="text-[10px] text-slate-500 uppercase">Anomalies</p><p class="text-xl font-bold text-amber-600 mt-0.5" id="kpiAnomaly">-</p><p class="text-[10px] text-slate-500 mt-0.5">Flagged shipments</p></div>
    </div>
    <div class="card p-4">
      <h2 class="text-xs font-semibold mb-2"><i class="fa-regular fa-clock text-slate-400"></i> Average Time to Release - End-to-End</h2>
      <p class="text-[11px] text-slate-500 mb-2">Total average clearance: <strong id="timelineTotal">-</strong></p>
      <div class="h-3 rounded-full overflow-hidden flex mb-3" id="timelineBar"></div>
      <div class="grid grid-cols-5 gap-1 text-center text-[10px]" id="timelineStages"></div>
    </div>
    <div class="card p-4">
      <h2 class="text-xs font-semibold mb-3">Stage Hours (bar)</h2>
      <div class="h-40"><canvas id="stageBarChart"></canvas></div>
    </div>
    <div class="card p-4">
      <h2 class="text-xs font-semibold mb-2">Delay Share</h2>
      <div class="flex gap-3 items-center">
        <div class="w-28 h-28"><canvas id="delayDonut"></canvas></div>
        <div class="text-[10px] space-y-1 flex-1" id="donutLegend"></div>
      </div>
    </div>
    <div class="card p-4 space-y-2" id="bottleneckCards"></div>
    <div class="card p-4">
      <h2 class="text-xs font-semibold mb-2"><i class="fa-solid fa-lightbulb text-amber-500"></i> Key Takeaways</h2>
      <ul class="text-xs space-y-1 text-slate-600 list-disc pl-4" id="takeawaysList"></ul>
      <p class="text-xs text-slate-500 mt-2 italic" id="aiInsight"></p>
    </div>
    <div class="card p-4">
      <h2 class="text-xs font-semibold mb-2">Regional Benchmarks</h2>
      <div class="grid grid-cols-3 gap-2 text-center text-xs" id="benchCards"></div>
    </div>
  </section>
  <section id="panel-shipments" class="tab-panel hidden space-y-3">
    <div class="flex flex-wrap gap-2 items-center">
      <input id="shipSearch" type="text" placeholder="Search BL / Container..." class="border border-slate-300 rounded-lg px-2 py-1 text-sm flex-1 min-w-[140px]" oninput="renderShipments()" />
      <select id="shipFilter" class="border border-slate-300 rounded-lg px-2 py-1 text-sm" onchange="renderShipments()">
        <option value="all">All</option>
        <option value="Released">Released</option>
        <option value="anomaly">Anomaly</option>
        <option value="On Hold">On Hold</option>
      </select>
    </div>
    <div id="shipList" class="space-y-2"></div>
  </section>
  <section id="panel-agencies" class="tab-panel hidden space-y-3">
    <div id="agencyCards" class="grid gap-2.5"></div>
  </section>
  <section id="panel-anomalies" class="tab-panel hidden space-y-3">
    <div class="card p-3 text-xs text-slate-600">Rules: release time > 2× median, elevated stage hours, holds, multi-agency friction.</div>
    <div id="anomalyTable" class="space-y-2"></div>
  </section>`;
}
function getQ(){return PORT_DATA[currentPort].quarters[currentQuarter];}
function onFilterChange(){currentPort=document.getElementById('portSelect').value;currentQuarter=document.getElementById('quarterSelect').value;renderAll();}
function renderAll(){
  const q=getQ(),stages=META.stages,hours=stages.map(s=>q.stageHours[s.id]),total=q.totalHours,prior=q.priorTotalHours;
  const delta=prior?Math.round((1-total/prior)*100):0;
  document.getElementById('hdrQuarter').textContent=currentQuarter;
  document.getElementById('hdrPort').textContent=PORT_DATA[currentPort].portName;
  document.getElementById('hdrSample').textContent=q.sampleSize.toLocaleString()+' shipments';
  document.getElementById('kpiTotal').innerHTML=total+' <span class="text-sm font-normal text-slate-500">hrs</span>';
  document.getElementById('kpiDelta').innerHTML=delta>0?'<span class="text-emerald-600">\u2193 '+delta+'% vs prior quarter</span>':'vs prior '+prior+' hrs';
  document.getElementById('kpiSample').textContent=q.sampleSize.toLocaleString();
  const topBn=q.bottlenecks[0];
  document.getElementById('kpiBottleneck').textContent=topBn?topBn.title.split(' ').pop():'-';
  document.getElementById('kpiBottleneckDetail').textContent=topBn?topBn.delayHours+' hrs ('+topBn.pct+'%)':'-';
  document.getElementById('kpiAnomaly').textContent=q.anomalyCount;
  document.getElementById('timelineBar').innerHTML=stages.map((s,i)=>'<div style="width:'+(hours[i]/total*100).toFixed(1)+'%;background:'+s.color+'"></div>').join('');
  document.getElementById('timelineTotal').textContent=total+' hours ('+(total/24).toFixed(1)+' days)';
  const icons=['fa-ship','fa-file-lines','fa-user-check','fa-magnifying-glass','fa-warehouse'];
  document.getElementById('timelineStages').innerHTML=stages.map((s,i)=>'<div><div class="w-7 h-7 mx-auto rounded-full text-white flex items-center justify-center mb-0.5 text-[9px]" style="background:'+s.color+'"><i class="fa-solid '+icons[i]+'"></i></div><p class="font-medium">'+s.short+'</p><p class="text-slate-500">'+hours[i]+' hrs</p></div>').join('');
  document.getElementById('bottleneckCards').innerHTML=q.bottlenecks.map(b=>'<div class="bg-rose-50 border border-rose-200 rounded-lg p-2.5 text-xs"><p class="font-semibold text-rose-800"><i class="fa-solid fa-triangle-exclamation mr-1"></i> '+b.title+'</p><p class="text-[10px] text-rose-700 mt-0.5">'+b.desc+'</p><p class="text-[10px] text-rose-600 mt-0.5">Avg delay: '+b.delayHours+' hrs ('+b.pct+'% of total)</p></div>').join('');
  if(stageBarChart)stageBarChart.destroy();
  stageBarChart=new Chart(document.getElementById('stageBarChart'),{type:'bar',data:{labels:stages.map(s=>s.short),datasets:[{data:hours,backgroundColor:stages.map(s=>s.color),borderRadius:3}]},options:{indexAxis:'y',plugins:{legend:{display:false},datalabels:{anchor:'end',align:'right',font:{size:10,weight:'600'},formatter:v=>v+'h'}},scales:{x:{beginAtZero:true,max:Math.max(...hours)+10},y:{grid:{display:false}}}}});
  if(delayDonut)delayDonut.destroy();
  const donutOrder=[4,1,2,0,3];
  delayDonut=new Chart(document.getElementById('delayDonut'),{type:'doughnut',data:{labels:donutOrder.map(i=>stages[i].short),datasets:[{data:donutOrder.map(i=>hours[i]),backgroundColor:donutOrder.map(i=>stages[i].color),borderWidth:0}]},options:{cutout:'60%',plugins:{legend:{display:false},datalabels:{display:false}}}});
  document.getElementById('donutLegend').innerHTML=donutOrder.map(i=>'<div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-sm" style="background:'+stages[i].color+'"></span>'+stages[i].short+': '+hours[i]+'h ('+Math.round(hours[i]/total*100)+'%)</div>').join('');
  document.getElementById('takeawaysList').innerHTML=q.takeaways.map(t=>'<li>'+t+'</li>').join('');
  document.getElementById('aiInsight').textContent=q.aiInsight;
  const bm=q.benchmarks;
  document.getElementById('benchCards').innerHTML=`<div class="card p-2"><p class="text-slate-500">Lomé</p><p class="font-bold">${bm.lome}h</p></div><div class="card p-2"><p class="text-slate-500">Tema</p><p class="font-bold">${bm.tema}h</p></div><div class="card p-2"><p class="text-slate-500">North Star</p><p class="font-bold text-emerald-600">${bm.northStar}h</p></div>`;
  renderShipments(); renderAgencies(); renderAnomalies();
}
function renderShipments(){
  const q=(document.getElementById('shipSearch').value||'').toLowerCase();
  const st=document.getElementById('shipFilter').value;
  let list=(SHIPMENTS||[]).filter(s=>s.port===currentPort);
  if(q) list=list.filter(s=>(s.bl||'').toLowerCase().includes(q)||(s.container||'').toLowerCase().includes(q));
  if(st==='anomaly') list=list.filter(s=>s.anomaly);
  else if(st!=='all') list=list.filter(s=>s.status===st);
  document.getElementById('shipList').innerHTML=list.slice(0,40).map(s=>`<div class="card p-3 text-xs ${s.anomaly?'anomaly-row':''}"><div class="flex justify-between"><span class="font-semibold">${s.bl}</span><span class="text-slate-500">${s.container}</span></div><div class="mt-1 text-slate-600">${s.cargo} · ${s.total}h · ${s.status}</div></div>`).join('')||'<p class="text-xs text-slate-500">No shipments match.</p>';
}
function renderAgencies(){
  const q=getQ();
  document.getElementById('agencyCards').innerHTML=(q.agencies||[]).map(a=>`<div class="card p-3"><div class="flex justify-between"><h3 class="text-sm font-semibold">${a.name}</h3><span class="text-xs font-bold ${a.status==='Good'?'text-emerald-600':a.status==='Critical'?'text-rose-600':'text-amber-600'}">${a.status}</span></div><p class="text-[11px] text-slate-500 mt-1">Avg ${a.avgHours}h · share ${a.share}%</p></div>`).join('')||'<p class="text-xs text-slate-500">No agency data.</p>';
}
function renderAnomalies(){
  const list=(SHIPMENTS||[]).filter(s=>s.port===currentPort&&s.anomaly);
  document.getElementById('anomalyTable').innerHTML=list.map(s=>`<div class="card p-3 anomaly-row text-xs"><div class="font-semibold">${s.bl} · ${s.container}</div><div class="text-slate-600 mt-0.5">${s.cargo} · ${s.total}h · ${s.status}</div></div>`).join('')||'<p class="text-xs text-slate-500">No anomalies in sample for this port.</p>';
}
function showTab(name){
  document.querySelectorAll('.tab-panel').forEach(el=>el.classList.add('hidden'));
  document.getElementById('panel-'+name).classList.remove('hidden');
  document.querySelectorAll('.tab-btn').forEach(b=>{b.classList.remove('tab-active');b.classList.add('text-slate-600');});
  const btn=document.getElementById('tab-'+name);
  btn.classList.add('tab-active');btn.classList.remove('text-slate-600');
}
boot();
</script>
</body>
</html>
