<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><title>Nigeria NSW | TRS</title></head>
<body><p style="font-family:system-ui;padding:2rem">Loading TRS Observatory…</p>
<script>
(async function(){
  const n=2;
  let b64='';
  for(let i=0;i<n;i++){ b64 += (await fetch('z'+i+'.txt').then(r=>r.text())).trim(); }
  const bin = Uint8Array.from(atob(b64), c=>c.charCodeAt(0));
  const ds = new DecompressionStream('deflate');
  const stream = new Blob([bin]).stream().pipeThrough(ds);
  const html = await new Response(stream).text();
  document.open(); document.write(html); document.close();
})().catch(e=>{ document.body.innerHTML='<pre>'+e+'\n'+e.stack+'</pre>'; });
</script></body></html>
